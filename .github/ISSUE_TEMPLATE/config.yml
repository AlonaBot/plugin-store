# 关闭空白 Issue，按问题类型提供对应入口。
blank_issues_enabled: false
contact_links:
  - name: 安全漏洞报告 / Security vulnerability
    url: https://github.com/AlonaBot/AlonaBot/security/advisories/new
    about: 私密提交漏洞、影响与复现步骤，先移除凭据和真实用户数据。Report vulnerabilities privately after removing credentials and real user data.
  - name: 讨论区 / Discussions
    url: https://github.com/AlonaBot/AlonaBot/discussions
    about: 使用求助、方案交流请前往讨论区。Ask usage questions and discuss designs here.
  - name: Wiki
    url: https://github.com/AlonaBot/AlonaBot/wiki
    about: 按使用、组件开发和贡献任务查找文档。Find guides for usage, component development and contributions.
  - name: 文档 / Documentation
    url: https://github.com/AlonaBot/AlonaBot/blob/main/docs/index.md
    about: 使用问题请先查阅文档。Please check the documentation for usage questions.
