# 只写 GitHub 标签和 assignee，不 checkout、不运行 PR 提交的代码。
name: PR triage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: 建立路径标签
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 标签名称与 labeler.yml 对应。
          gh label create 'area: docs' --repo "$REPO" --color 0E8A16 --description '文档与贡献说明 / Documentation' --force
          gh label create 'area: index' --repo "$REPO" --color 0052CC --description '组件索引与校验 / Component index' --force
          gh label create 'area: github-actions' --repo "$REPO" --color FBCA04 --description '仓库自动化 / Repository automation' --force
      - name: 同步路径标签
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ github.token }}
          sync-labels: true
      - name: 指派维护者
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee FlanChanXwO
