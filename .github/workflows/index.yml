# 只用 Node 标准库校验 index.json；不下载、不构建、不执行被索引的组件。
name: Index check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    name: Index format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检查 main 文件范围
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$RUNNER_TEMP/main-paths"
          rejected=0
          while IFS= read -r -d '' path; do
            case "$path" in
              .agents/*|.claude/*|.codex/*|.serena/*|.playwright-cli/*|docs/goals/*|docs/execution-order.md|docs/benchmarks.md|spec/*|goal-[0-9]*/*|delegation-skills-workspace/*|experiments/*)
                printf 'main 包含个人维护资料：%q\n' "$path"
                rejected=1
                ;;
            esac
          done < "$RUNNER_TEMP/main-paths"
          exit "$rejected"
      - name: 检查提交范围的空白错误
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            git show --format= --check HEAD
          else
            git diff --check "$BASE_SHA" HEAD
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.5.1
      - name: 校验 index.json
        run: node scripts/check-index.mjs
